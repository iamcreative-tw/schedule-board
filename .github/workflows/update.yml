name: 更新檔期資料

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 從 Notion 抓資料並產生網頁
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python build.py

      - name: 存回 GitHub
        run: |
          git config --global user.name  "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "資料沒有變動，這次不用更新。"
          else
            git commit -m "更新檔期資料 $(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M')"
            git push
            echo "已更新，約 1 分鐘後網站生效。"
          fi
