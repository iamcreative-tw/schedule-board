name: 更新檔期資料

# 只有手動按按鈕才會執行，不會自己偷跑
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 允許把產生的 index.html 存回 repo

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 從 Notion 抓資料並產生網頁
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python build.py

      # 通知信不在這裡寄。Google Workspace 不讓 Apps Script 對外開放，
      # 所以改成 Apps Script 每 15 分鐘自己來讀「最近更新.md」，有變動才寄信。
      # 程式在 Apps Script 專案「檔期看板通知」的 檢查更新() 裡。

      - name: 存回 GitHub（網站會自動重新發布）
        run: |
          git config --global user.name  "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html snapshot.json 最近更新.md
          if git diff --staged --quiet; then
            echo "資料沒有變動，這次不用更新。"
          else
            git commit -m "更新檔期資料 $(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M')"
            git push
            echo "✅ 已更新，約 1 分鐘後網站生效。"
          fi
